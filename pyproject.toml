[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "null-research-benchmark"
version = "0.1.0"
description = "Ten public, synthetic scientific-workflow task families with a shared scorer and multiple harness adapters"
requires-python = ">=3.11"
license = {file = "LICENSE"}
readme = "README.md"
authors = [{name = "NuLl Research Benchmark contributors"}]
dependencies = []

[project.optional-dependencies]
inspect = ["inspect-ai==0.3.281"]

[project.scripts]
nrb = "nrb.cli:main"

[tool.setuptools.packages.find]
include = ["nrb*"]

[project.urls]
Repository = "https://github.com/Mr-NuLl-01/NuLl-s_Research_Benchmark"
