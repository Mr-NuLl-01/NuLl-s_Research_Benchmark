name: NRB V2 complete benchmark

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  v2-core:
    name: Twenty-task contracts, native controls and webpage
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install evaluator and pinned native proof toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gfortran zstd curl ca-certificates libgmp10
          python -m pip install -e . numpy==2.3.5 scipy==1.17.0
          sh environments/v2/install_lean.sh "$RUNNER_TEMP/nrb-lean-4.19.0" 2>&1 | tee v2-lean-install.log
          echo "NRB_LEAN=$RUNNER_TEMP/nrb-lean-4.19.0/bin/lean" >> "$GITHUB_ENV"
      - name: Record actual native environment
        run: |
          set -euo pipefail
          python --version > v2-python-version.txt
          python -m pip freeze > v2-python-packages.txt
          gfortran --version > v2-fortran-version.txt
          "$NRB_LEAN" --version > v2-lean-version.txt
          node --version > v2-node-version.txt
      - name: All V2 regression tests, including real Fortran and Lean
        run: |
          set -euo pipefail
          python -m unittest discover -s tests_v2 -v 2>&1 | tee v2-tests.log
      - name: Thirteen references across three seeds and scientific wrong controls
        run: |
          set -euo pipefail
          python scripts/v2/check_round2.py controls --execution trusted --seeds 0,17,2026 --mutants representative --out v2-native-controls.json 2>&1 | tee v2-native-controls.log
      - name: Frozen packets, input assets and public score contracts agree
        run: |
          set -euo pipefail
          python scripts/v2/check_round2.py contracts --out v2-release-contracts.json 2>&1 | tee v2-release-contracts.log
      - name: Web score and interaction checks
        run: |
          set -euo pipefail
          node web/checks.cjs 2>&1 | tee v2-web-checks.log
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: v2-core-evidence
          path: |
            v2-*.log
            v2-*-version.txt
            v2-python-packages.txt
            v2-native-controls.json
            v2-release-contracts.json

  v2-docker:
    name: Actual Python, Fortran and Lean containers
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Build candidate runtimes
        run: |
          set -euo pipefail
          python -m pip install -e . numpy==2.3.5 scipy==1.17.0
          docker build --platform=linux/amd64 -t nrb-v2:local -f environments/v2/Dockerfile . 2>&1 | tee v2-runtime-build.log
          docker build --platform=linux/amd64 -t nrb-v2-lean:local -f environments/v2/LeanDockerfile . 2>&1 | tee v2-lean-build.log
          docker image inspect nrb-v2:local nrb-v2-lean:local > v2-images.json
          docker version > v2-docker-version.txt
          python -m pip freeze > v2-python-packages.txt
      - name: Observe the production candidate isolation boundary
        run: |
          set -euo pipefail
          python scripts/v2/check_docker.py --image nrb-v2:local --out v2-isolation.json 2>&1 | tee v2-isolation.log
      - name: Thirteen references and every reviewed wrong control
        run: |
          set -euo pipefail
          python scripts/v2/check_round2.py controls --execution docker --seeds 17 --mutants all --image nrb-v2:local --lean-image nrb-v2-lean:local --out v2-docker-controls.json 2>&1 | tee v2-docker-controls.log
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: v2-docker-evidence
          path: |
            v2-*.log
            v2-isolation.json
            v2-docker-controls.json
            v2-images.json
            v2-docker-version.txt
            v2-python-packages.txt
