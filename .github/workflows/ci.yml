name: NRB validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install evaluator
        run: python -m pip install -e .
      - name: Core contracts and scientific negative controls
        run: python -m unittest discover -s tests -v 2>&1 | tee unit-tests.log
      - name: Thirty seeded oracle and empty controls
        run: python -m nrb selftest --seeds 0,17,101 --out selftest.json
      - name: Frozen public packets match generators
        run: |
          python scripts/freeze_questions.py --dest /tmp/nrb-regenerated-questions
          diff -r questions /tmp/nrb-regenerated-questions
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: core-python-${{ matrix.python }}
          path: |
            unit-tests.log
            selftest.json

  framework-runtime:
    name: Inspect, promptfoo, Harbor schema
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      INSPECT_DISABLE_MODEL_API: '1'
      PROMPTFOO_DISABLE_TELEMETRY: '1'
      PROMPTFOO_DISABLE_UPDATE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install pinned optional runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2 fonts-dejavu-core
          python -m pip install -e . inspect-ai==0.3.281 harbor==0.24.0 CairoSVG==2.8.2
          npm install -g promptfoo@0.124.1
          python -m pip freeze > installed-python.txt
          promptfoo --version > installed-promptfoo.txt
      - name: Actual Inspect mock eval and Harbor schema
        run: |
          python -c 'import inspect_ai, harbor'
          python -m unittest discover -s tests -p test_optional_runtime.py -v 2>&1 | tee optional-runtime.log
      - name: Actual promptfoo CLI with ten expected empty failures
        run: python adapters/promptfoo/smoke.py --dest /tmp/nrb-promptfoo-smoke
      - name: Actual SVG rendering with seven negative controls
        run: |
          python -m unittest discover -s tests -p test_figure_visibility.py -v
          python -m unittest discover -s tests -p test_review_evidence.py -v
          python scripts/check_rendering.py --out /tmp/nrb-render-controls
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: framework-runtime
          path: |
            optional-runtime.log
            installed-python.txt
            installed-promptfoo.txt
            /tmp/nrb-promptfoo-smoke
            /tmp/nrb-render-controls

  docker-runtime:
    name: Docker and separate Harbor verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install evaluator and pinned Harbor
        run: |
          python -m pip install -e . harbor==0.24.0
          python -m pip freeze > installed-python.txt
          docker pull python:3.12-slim
          docker image inspect python:3.12-slim > docker-image.json
          docker version > docker-version.txt
      - name: Actual candidate-code container checks
        run: python scripts/check_docker.py --out docker-checks.json
      - name: Actual candidate image isolation and offline network probe
        run: python scripts/check_candidate_isolation.py --out candidate-isolation.json
      - name: Actual Harbor oracle, artifact transfer, and separate verifier
        run: python adapters/harbor/smoke.py --dest /tmp/nrb-harbor-smoke --tasks all
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: docker-harbor-runtime
          path: |
            installed-python.txt
            docker-image.json
            docker-version.txt
            docker-checks.json
            candidate-isolation.json
            candidate-isolation-materials
            /tmp/nrb-harbor-smoke

  v1-core:
    name: V1 science Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install evaluator and real Fortran compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran
          python -m pip install -e .
          gfortran --version > fortran-version.txt
      - name: V1 science, independent properties, malformed candidates and review contracts
        run: python -m unittest discover -s tests_v1 -v 2>&1 | tee v1-tests.log
      - name: Thirty seeded references and eighty-four executable wrong controls
        run: python -m nrb_v1 selftest --tasks coding --seeds 0,17,2026 --include-mutants --execution trusted --out v1-selftest.json
      - name: Nineteen standalone files match exact generators
        run: |
          python -m nrb_v1 export --format files --tasks all --seed 17 --dest /tmp/v1-frozen
          diff -r tasks/v1.0 /tmp/v1-frozen
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: v1-core-python-${{ matrix.python }}
          path: |
            v1-tests.log
            v1-selftest.json
            fortran-version.txt

  v1-framework:
    name: V1 Inspect, promptfoo and Harbor schema
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      INSPECT_DISABLE_MODEL_API: '1'
      PROMPTFOO_DISABLE_TELEMETRY: '1'
      PROMPTFOO_DISABLE_UPDATE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install pinned frameworks
        run: |
          python -m pip install -e . inspect-ai==0.3.281 harbor==0.24.0
          npm install -g promptfoo@0.124.1
          python -m pip freeze > v1-python-packages.txt
          promptfoo --version > v1-promptfoo-version.txt
      - name: Actual Inspect mock and Harbor schema plus canonical conversions
        run: python -m unittest discover -s tests_v1 -p test_adapters.py -v 2>&1 | tee v1-framework.log
      - name: Actual promptfoo CLI with ten expected empty failures
        run: python adapters/v1/promptfoo_smoke.py --dest /tmp/v1-promptfoo
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: v1-framework-runtime
          path: |
            v1-framework.log
            v1-python-packages.txt
            v1-promptfoo-version.txt
            /tmp/v1-promptfoo

  v1-docker:
    name: V1 Docker, Fortran and separate Harbor verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Build scientific runtime
        run: |
          python -m pip install -e . harbor==0.24.0
          docker build -t nrb-v1:local -f environments/v1/Dockerfile .
          docker image inspect nrb-v1:local > v1-image.json
          docker version > v1-docker-version.txt
      - name: Execute ten references and eight scientific wrong controls
        run: python scripts/v1/check_docker.py --image nrb-v1:local --out v1-docker-check.json
      - name: Actual candidate image filesystem and network isolation
        run: python scripts/v1/check_isolation.py --image nrb-v1:local --out v1-isolation.json
      - name: Actual ten-task Harbor oracle transfer and separate verification
        run: python adapters/v1/harbor_smoke.py --dest /tmp/v1-harbor --tasks coding --image nrb-v1:local
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: v1-docker-harbor-runtime
          path: |
            v1-image.json
            v1-docker-version.txt
            v1-docker-check.json
            v1-isolation.json
            v1-isolation-materials
            /tmp/v1-harbor
