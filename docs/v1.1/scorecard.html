 en:{title:'Offline review scorecard',subtitle:'Evidence first. Criterion by criterion. Unknown stays unknown.',steps:['1 · Generate a review packet','2 · Import both JSON files','3 · Inspect artifacts and assess','4 · Export and validate with the CLI'],privacy:'Files stay in this browser. No uploads, network requests or local-storage persistence. Closing or refreshing this page loses unexported changes. Export drafts regularly.',import:'Import review / automatic report',importHelp:'Select review.json and automatic.json from the same packet together, or import them separately.',help:'How to use',track:'Separate scoring track',tracks:{coding:'Coding C01–C10',research:'Research R01–R06',optional:'Optional X01–X03',optional_video_a:'Video A · X04',optional_video_b:'Video B · X05'},trackWarning:'Task-level views only; no cross-track total. Optional tasks must be enabled before generation. This page does not change run configuration.',footer:'NRB V1.1 · Self-contained review editor. Translations aid reading; original rubric text and weights remain unchanged in exports. The benchmark CLI verifies identity, artifact bytes, scoring and comparison eligibility.',helpText:'Generate an evaluator review packet with nrb-v1 review-packet. Import its review.json and automatic.json here, then open and inspect the actual artifacts/ files. X04/X05 also require watching inputs/source.mp4; X05 additionally requires inputs/reference.mp4. Record the actual reviewer, integer ratings 0–4, evidence and rationale. Assess core requirements separately; missing modalities stay unassessed. Save the exported review beside the original automatic.json and artifacts/, retaining inputs/ for video tasks, then use nrb-v1 grade --review. The browser neither executes candidate code nor verifies media bytes. Edit one submission/seed per task in this page; use separate pages for separate runs.',loaded:'Loaded',preview:'Rubric preview',required:'Required',optional:'Optional',manual:'Manual quality',automatic const $=id=>document.getElementById(id),E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const stable=v=>JSON.stringify(v,(_,x)=>isObj(x)?Object.keys(x).sort().reduce((o,k)=>(o[k]=x[k],o),{}):x),equal=(a,b)=>stable(a)===stable(b);
const current=()=>records.get(taskId)||{},task=()=>TASKS.find(t=>t.id===taskId),title=t=>(t.id.startsWith('C')?lang==='en':lang==='zh')?(TR.titles[t.id]||t.title):t.title;
function translatedCriterion(t,c,i){const a=t.id.startsWith('C')&&lang==='en'?TR.coding[c.id]:!t.id.startsWith('C')&&lang==='zh'?TR.rubrics[t.id]?.[i]:null;return a?{name:a[0],anchors:{'0':a[1],'2':a[2],'4':a[3]}}:lang==='en'&&c.name.includes(' / ')?{...c,name:c.name.split(' / ').slice(1).join(' / ')}:c;}
function translatedEssential(t,e,i){const key=/^C0[1-5]$/.test(t.id)?'C01':t.id;return (t.id.startsWith('C')?lang==='en':lang==='zh')?(TR.essential[key]?.[i]||e.requirement):e.requirement;}
function notice(message,type=''){const box=$('messages');box.className='statusbox '+type;box.textContent=message;}
function selectOptions(options,value){return options.map(([v,label])=>`<option value="${E(v)}"${String(value??'')===String(v)?' selected':''}>${E(label)}</option>`).join('');}
function field(label,value,attrs='',area=false,disabled=false){return `<label class="field">${E(label)}${area?`<textarea ${attrs}${disabled?' disabled':''}>${E(value)}</textarea>`:`<input type="text" value="${E(value)}" ${attrs}${disabled?' disabled':''}>`}<span class="print-values">${E(value)||'—'}</span></label>`;}
function readOnlyData(d){return `<pre>${E(JSON.stringify(d,null,2))}</pre>`;}
function updateHeader(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';$('app-title').textContent=text('title');$('app-subtitle').textContent=text('subtitle');$('language').textContent=lang==='zh'?'English':'中文';$('language').lang=lang==='zh'?'en':'zh-CN';$('workflow').innerHTML=text('steps').map(s=>`<span>${E(s)}</span>`).join('');$('privacy').textContent=text('privacy');$('import-label').textContent=text('import');$('import-help').textContent=text('importHelp');$('help-button').textContent=text('help');$('help-panel').textContent=text('helpText');$('track-label').textContent=text('track');$('track-warning').textContent=text('trackWarning');$('footer').textContent=text('footer');$('track-select').innerHTML=selectOptions(Object.entries(text('tracks')).filter(([key])=>TASKS.some(t=>t.track===key)),track);renderNav();}
function renderNav(){$('task-list').innerHTML=TASKS.filter(t=>t.track===track).map(t=>`<button type="button" class="task-button" data-task="${E(t.id)}" aria-current="${taskId===t.id}"><strong>${E(t.id)}<span class="tag ${records.get(t.id)?.ledger?'loaded':''}">${E(records.get(t.id)?.ledger?text('loaded'):text('preview'))}</span></strong><span class="task-name">${E(title(t))}</span></button>`).join('');}
function scoreInfo(){const {ledger:l,auto:a}=current(),t=task();const criteria=l?.criteria||[];const rated=criteria.filter(c=>Number.isInteger(c.score)&&c.score>=0&&c.score<=4);const manual=rated.length===t.rubric.length?rated.reduce((sum,c)=>sum+c.weight*c.score/4,0):null;const autoKnown=t.track==='coding'&&a&&finite(a.auto_points)&&a.auto_scored_max===70&&finite(a.auto_percent)&&Array.isArray(a.checks)&&a.checks.every(c=>typeof c.passed==='boolean');const auto=autoKnown?a.auto_points:null;const ineligible=a&&(a.comparison_eligible===false||(a.input_integrity&&a.input_integrity.unchanged!==true)||a.generation?.status==='harness_error');const total=!ineligible&&manual!==null&&(t.track!=='coding'||autoKnown)?manual+(t.track==='coding'?auto:0):null;const failed=!!(l?.essential_review.some(e=>e.outcome==='fail')||a?.missing_artifacts?.length||a?.checks?.some(c=>c.critical&&c.passed===false));return {manual,auto,total,rated:rated.length,autoKnown,ineligible,failed};}
function updateStats(){const s=scoreInfo(),t=task(),r=current();const n=v=>v===null?text('unknown'):Number(v.toFixed(4)).toString();$('authority-label').textContent=r.ledger?.reviewer?.type==='llm'?text('llm'):text('preview');$('manual-value').textContent=n(s.manual);$('auto-value').textContent=t.track==='coding'?n(s.auto):text('none');$('total-value').textContent=n(s.total);$('rating-count').textContent=`${s.rated} / ${t.rubric.length} ${text('assessed')}`;$('state').textContent=s.ineligible?text('ineligible'):s.failed?text('coreFailed'):s.manual===null?text('pending'):text('ready');$('state').className='state'+(s.failed||s.ineligible?' fail':'');const gates=r.ledger?.essential_review||[];$('core-count').textContent=r.ledger?(lang==='zh'?'核心责任':'Core requirements')+': '+['pass','fail','unassessed'].map(v=>v+' '+gates.filter(e=>e.outcome===v).length).join(' · '):'';$('change-state').textContent=r.dirty?text('dirty'):r.exported?text('saved'):text('noChanges');document.querySelectorAll('[data-points]').forEach(el=>{const i=+el.dataset.points,c=r.ledger?.criteria[i];el.textContent=`${text('weighted')}: ${c?.score===null||!c?text('unknown'):c.weight*c.score/4} / ${t.rubric[i].weight}`;});}
function render(){updateHeader();const t=task(),r=current(),l=r.ledger,a=r.auto,disabled=!l;const req=l?.essential_review||t.essential.map(e=>({...e,outcome:'unassessed',evidence:'',rationale:''}));const criteria=l?.criteria||t.rubric.map(c=>({...c,score:null,evidence:'',rationale:''}));
$('main').innerHTML=`<section class="card"><div class="eyebrow">${E(text('tracks')[t.track])} · ${E(t.id.startsWith('C')||t.id.startsWith('R')?text('required'):text('optional'))}</div><h2>${E(t.id)} · ${E(title(t))}</h2><p class="small">${E(t.title)}</p>${!l?`<div class="note">${E(text('noLedger'))}</div>`:''}<div class="stats"><div class="stat"><span>${E(text('manual'))}</span><strong id="manual-value"></strong><small id="rating-count"></small><small>/ ${t.track==='coding'?30:100}</small></div><div class="stat"><span>${E(text('automatic'))}</span><strong id="auto-value"></strong><small>${t.track==='coding'?'/ 70':'—'}</small></div><div class="stat"><span>${E(text('total'))}</span><strong id="total-value"></strong><small>/ 100 · <span id="authority-label">${E(l?.reviewer?.type==='llm'?text('llm'):text('preview'))}</span></small></div></div><div id="state" class="state"></div><p id="core-count" class="small"></p></section>
<section class="card"><div class="ledger-head"><h3>${E(text('binding'))}</h3>${l?`<button type="button" id="reset" class="no-print">${E(text('reset'))}</button>`:''}</div><p class="small">${E(text('modality'))}: ${E(Array.isArray(t.modality)?(t.modality.length?t.modality.join(', '):'text / code'):'text / code')} ${l?' · '+E(text('seed'))+': '+E(l.seed):''}</p><h4>${E(text('artifacts'))}</h4><ul class="requirements mono">${t.required_artifacts.map(f=>`<li>${E(f)}</li>`).join('')}</ul>${l?`<details><summary>${E(text('binding'))}</summary>${readOnlyData(Object.fromEntries(['schema','task_id','seed','evaluator_identity','packet_hash','submission_hash','rubric_hash','automatic_report_hash'].map(k=>[k,l[k]])))}</details><details><summary>${E(text('manifest'))}</summary>${readOnlyData(l.artifact_manifest)}</details>`:''}</section>
<section class="card"><h3>${E(text('reviewer'))}</h3><div class="grid2"><label class="field">${E(text('reviewerType'))}<select data-kind="reviewer" data-key="type" ${disabled?'disabled':''}>${selectOptions([['',text('choose')],['human',text('human')],['llm',text('llm')]],l?.reviewer?.type)}</select><span class="print-values">${E(l?.reviewer?.type||'—')}</span></label>${field(text('reviewerId'),l?.reviewer?.id,'data-kind="reviewer" data-key="id"',false,disabled)}${field(text('model'),l?.reviewer?.model,'data-kind="reviewer" data-key="model"',false,disabled)}${field(text('promptHash'),l?.reviewer?.prompt_hash,'data-kind="reviewer" data-key="prompt_hash"',false,disabled)}</div><p class="small">${E(text('llmNote'))}</p></section>

<section class="card"><h3>${E(text('quality'))}</h3><p class="small">${E(text('qualityHelp'))}</p>${criteria.map((c,i)=>{const tr=translatedCriterion(t,c,i);return `<article class="criterion"><div class="criterion-title"><h4>${E(c.id)} · ${E(tr.name)}</h4><span class="weight">${c.weight} / ${t.track==='coding'?30:100}</span></div><div class="anchors">${['0','2','4'].map(k=>`<div class="anchor"><b>${k}</b>${E(tr.anchors[k])}</div>`).join('')}</div><label class="rating">${E(text('score'))}<select aria-label="${E(c.id+' '+text('score'))}" data-kind="criterion" data-index="${i}" data-key="score"${disabled?' disabled':''}>${selectOptions([['',text('unrated')],...[0,1,2,3,4].map(n=>[String(n),String(n)])],c.score)}</select><span class="print-values">${E(c.score??text('unrated'))}</span><span class="weighted" data-points="${i}"></span></label><div class="grid2">${field(text('evidence'),c.evidence,`data-kind="criterion" data-index="${i}" data-key="evidence"`,true,disabled)}${field(text('rationale'),c.rationale,`data-kind="criterion" data-index="${i}" data-key="rationale"`,true,disabled)}</div><details><summary>${E(text('canonical'))}</summary>${readOnlyData({id:c.id,name:c.name,weight:c.weight,anchors:c.anchors})}</details></article>`;}).join('')}</section>

<section class="card"><h3>${E(text('automatic'))}</h3><p class="small">${E(text('autoHelp'))}</p>${a?`<p>${E(text('bound'))}</p><p class="small">${E(a.completion_status)} · auto_scored_max: ${E(a.auto_scored_max??'—')}</p>${a.missing_artifacts?.length?`<p>${E(text('missing'))}: ${E(a.missing_artifacts.join(', '))}</p>`:''}${a.critical_failures?.length?`<p>${E(text('critical'))}: ${E(a.critical_failures.join(', '))}</p>`:''}<details class="print-hide"><summary>${E(text('autoDetails'))}</summary>${readOnlyData(a)}</details>`:`<p>${E(text('noAuto'))}</p>`}</section>
<div class="export-bar"><span class="small"><strong id="change-state"></strong><br>${E(text('exportNote'))}</span><button id="validate" type="button"${disabled?' disabled':''}>${E(text('validate'))}</button><button id="export-draft" type="button"${disabled?' disabled':''}>${E(text('draft'))}</button><button id="export-checked" class="primary" type="button"${disabled?' disabled':''}>${E(text('checked'))}</button><button id="print" type="button">${E(text('print'))}</button></div>`;updateStats();}
function renderMedia(l,disabled){if(!l?.media_review)return '';const m=l.media_review;const statusLabels=lang==='zh'?{unassessed:'未评 · unassessed',present:'确认包含给定配乐 · present',missing:'缺失给定配乐 · missing'}:{unassessed:'Unassessed',present:'Supplied soundtrack present',missing:'Supplied soundtrack missing'};const actions=lang==='zh'?{watched_full:'完整观看',listened_full:'完整收听'}:{watched_full:'Watch in full',listened_full:'Listen in full'};return `<section class="card"><h3>${E(text('media'))}</h3><p class="small">${E(text('mediaHelp'))}</p><label class="field">${lang==='zh'?'配乐检查（独立核心责任，无额外视觉分）':'Soundtrack check · separate core requirement, no extra visual points'}<select data-kind="media-audio" data-key="status">${selectOptions(Object.entries(statusLabels),m.audio_check.status)}</select><span class="print-values">${E(statusLabels[m.audio_check.status])}</span></label>${field(text('evidence'),m.audio_check.evidence,'data-kind="media-audio" data-key="evidence"',true)}<p class="small mono hash">soundtrack.wav SHA-256: ${E(m.audio_check.expected_soundtrack_sha256)}</p>${m.observations.map((o,i)=>`<div class="observation"><h4>${E(actions[o.action])} · ${E(o.artifact)}</h4><p class="small mono hash">SHA-256: ${E(o.sha256??'null')}</p><label class="check"><input type="checkbox" data-kind="media-observation" data-index="${i}" data-key="performed"${o.performed?' checked':''}><span>${E(text('performed'))}<span class="print-values">${E(o.performed?text('yes'):text('no'))}</span></span></label>${field(text('observationEvidence'),o.evidence,`data-kind="media-observation" data-index="${i}" data-key="evidence"`,true)}</div>`).join('')}${m.scenes.map((scene,i)=>`<div class="scene"><h4>${E(text('scene'))} ${scene.scene} · ${scene.interval_seconds[0]}–${scene.interval_seconds[1]} s</h4><label class="check"><input type="checkbox" data-kind="media-scene" data-index="${i}" data-key="observed"${scene.observed?' checked':''}><span>${E(text('performed'))}<span class="print-values">${E(scene.observed?text('yes'):text('no'))}</span></span></label>${field(text('time')+(lang==='zh'?'；多个时间用逗号分隔':' · comma-separated'),scene.timecodes_seconds.join(', '),`data-kind="media-scene" data-index="${i}" data-key="timecodes_seconds" inputmode="decimal"`)}${field(text('observationEvidence'),scene.evidence,`data-kind="media-scene" data-index="${i}" data-key="evidence"`,true)}</div>`).join('')}<details><summary>media_review · ${E(text('binding'))}</summary>${readOnlyData({schema:m.schema,task_id:m.task_id,input_packet_hash:m.input_packet_hash,protocol:m.protocol})}</details></section>`;}
function invalidNumbers(v){if(typeof v==='number')return !Number.isFinite(v)||(Number.isInteger(v)&&!Number.isSafeInteger(v));if(Array.isArray(v))return v.some(invalidNumbers);if(isObj(v))return Object.values(v).some(invalidNumbers);return false;}
function forbiddenKeys(value){if(Array.isArray(value))return value.some(forbiddenKeys);if(!isObj(value))return false;return Object.keys(value).some(k=>['__proto__','prototype','constructor'].includes(k)||forbiddenKeys(value[k]));}
function bindingErrors(l,a){const errors=[];for(const key of ['task_id','seed','evaluator_identity','packet_hash','submission_hash','rubric_hash'])if(!equal(l[key],a[key]))errors.push('Binding mismatch: '+key);if(l.automatic_report_hash!==a.report_hash)errors.push('Binding mismatch: automatic_report_hash');return errors;}
function ledgerErrors(l,strict=false,a=null){const errors=[],t=TASKS.find(t=>t.id===l?.task_id);if(!isObj(l)||l.schema!=='nrb-review-v1'||!t)return ['Expected nrb-review-v1 with a supported task_id.'];if(!Number.isSafeInteger(l.seed))errors.push('seed must be a safe integer.');if(!isObj(l.evaluator_identity)||!sha(l.evaluator_identity.evaluator_digest))errors.push('Missing evaluator identity/digest.');for(const k of ['packet_hash','submission_hash','rubric_hash','automatic_report_hash'])if(!sha(l[k]))errors.push('Invalid '+k);if(l.rubric_hash!==t.rubric_hash)errors.push('Rubric fingerprint differs from this scorecard. Rebuild the page from the same benchmark version.');
if(!Array.isArray(l.criteria)||l.criteria.length!==t.rubric.length||l.criteria.some((c,i)=>c?.id!==t.rubric[i].id))errors.push('Missing/duplicate quality dimensions.');else{const ids=new Set;for(const c of l.criteria){const orig=t.rubric.find(x=>x.id===c.id);if(!orig||ids.has(c.id)){errors.push('Unknown/duplicate criterion: '+c.id);continue;}ids.add(c.id);if(!equal({id:c.id,name:c.name,weight:c.weight,anchors:c.anchors},orig))errors.push('Canonical rubric changed: '+c.id);if(c.score!==null&&(!Number.isInteger(c.score)||c.score<0||c.score>4))errors.push(c.id+': score must be null or integer 0..4.');if(typeof c.evidence!=='string'||typeof c.rationale!=='string')errors.push(c.id+': evidence/rationale must be strings.');if(strict&&(c.score===null||!nonempty(c.evidence)||!nonempty(c.rationale)))errors.push(c.id+': level, evidence and rationale required.');}}
if(!Array.isArray(l.essential_review)||l.essential_review.length!==t.essential.length||l.essential_review.some((e,i)=>e?.id!==t.essential[i].id))errors.push('Missing/duplicate core requirements.');else{const ids=new Set;for(const e of l.essential_review){const orig=t.essential.find(x=>x.id===e.id);if(!orig||ids.has(e.id)||orig.requirement!==e.requirement)errors.push('Core requirement changed/duplicated: '+e.id);ids.add(e.id);if(!['pass','fail','unassessed'].includes(e.outcome))errors.push(e.id+': invalid core outcome.');if(typeof e.evidence!=='string'||typeof e.rationale!=='string')errors.push(e.id+': evidence/rationale must be strings.');if(strict&&e.outcome!=='unassessed'&&(!nonempty(e.evidence)||!nonempty(e.rationale)))errors.push(e.id+': core conclusion needs evidence and rationale.');}}
if(!isObj(l.artifact_manifest))errors.push('Missing artifact_manifest.');else for(const [name,entry]of Object.entries(l.artifact_manifest)){if(!name||name.startsWith('/')||name.includes('\\')||name.split('/').some(p=>p==='..'||p==='.'||p==='')||!isObj(entry)||!sha(entry.sha256)||!Number.isSafeInteger(entry.bytes)||entry.bytes<0)errors.push('Invalid artifact manifest: '+name);}
const expected=t.modal_observation_artifacts||[];if(!Array.isArray(l.observations)||l.observations.length!==expected.length)errors.push('Missing/duplicate actual observations.');else{const names=new Set;for(const o of l.observations){const action=o.artifact?.endsWith('.mp4')?'watched':o.artifact?.endsWith('.wav')?'listened':t.id==='X01'?'interacted':'viewed';if(!expected.includes(o.artifact)||names.has(o.artifact))errors.push('Unknown/duplicate observation: '+o.artifact);names.add(o.artifact);if(o.action!==action||!equal(o.sha256??null,l.artifact_manifest?.[o.artifact]?.sha256??null))errors.push('Observation binding changed: '+o.artifact);if(typeof o.performed!=='boolean'||typeof o.evidence!=='string')errors.push('Invalid observation fields: '+o.artifact);if(strict&&o.performed&&(!l.artifact_manifest?.[o.artifact]||!nonempty(o.evidence)))errors.push(o.artifact+': performed observation needs actual bytes and findings.');if(strict&&(l.essential_review?.some(e=>e.outcome==='pass')||['X04','X05'].includes(t.id))&&!o.performed)errors.push(o.artifact+': core pass or video scoring requires actual observation.');}}
if(!isObj(l.reviewer))errors.push('Missing reviewer object.');else{for(const k of ['type','id','model','prompt_hash'])if(l.reviewer[k]!==null&&typeof l.reviewer[k]!=='string')errors.push('Invalid reviewer.'+k);if(l.reviewer.type!==null&&!['human','llm'].includes(l.reviewer.type))errors.push('Reviewer type must be human, llm or null.');if(strict&&(!['human','llm'].includes(l.reviewer.type)||!nonempty(l.reviewer.id)))errors.push('Record actual reviewer type and identity.');if(strict&&l.reviewer.type==='llm'&&(!nonempty(l.reviewer.model)||!nonempty(l.reviewer.prompt_hash)))errors.push('LLM review needs actual model and prompt fingerprint.');}
if(a)errors.push(...bindingErrors(l,a));if(strict&&!a)errors.push(text('needAuto'));errors.push(...mediaErrors(l,strict));return errors;}
function autoErrors(a){const t=TASKS.find(t=>t.id===a?.task_id);if(!isObj(a)||!t||!Array.isArray(a.checks)||!Array.isArray(a.essential_review)||!Array.isArray(a.missing_artifacts)||!sha(a.report_hash)||!sha(a.packet_hash)||!sha(a.submission_hash)||!sha(a.rubric_hash)||!isObj(a.evaluator_identity))return ['Expected a benchmark automatic.json, not a submission, summary or arbitrary score file.'];const errors=[];if(a.track!==t.track||a.auto_max!==(t.track==='coding'?70:0)||a.review_max!==(t.track==='coding'?30:100))errors.push('Automatic report track or score limits differ from the task.');if(a.rubric_hash!==t.rubric_hash)errors.push('Automatic report rubric differs from this page.');if(a.review_points!==null||a.total!==null||a.reviewer_type!==null)errors.push('Import the original unreviewed automatic.json, not a merged result.');if(t.track==='coding'){if(!finite(a.auto_points)||!finite(a.auto_scored_max)||a.auto_points<0||a.auto_points>a.auto_scored_max||a.auto_scored_max>70)errors.push('Invalid automatic points or coverage.');if(a.checks.some(c=>!isObj(c)||![true,false,null].includes(c.passed)||!finite(c.weight)||c.weight<=0))errors.push('Invalid automatic checks.');const weight=a.checks.reduce((s,c)=>s+c.weight,0),covered=a.checks.filter(c=>c.passed!==null).reduce((s,c)=>s+c.weight,0),earned=a.checks.filter(c=>c.passed===true).reduce((s,c)=>s+c.weight,0);if(Math.abs(weight-70)>1e-9||Math.abs(covered-a.auto_scored_max)>1e-9||Math.abs(earned-a.auto_points)>1e-9)errors.push('Automatic check weights and totals disagree.');if(covered<70&&a.auto_percent!==null)errors.push('Incomplete automatic results must keep auto_percent=null.');if(covered===70&&(!finite(a.auto_percent)||Math.abs(a.auto_percent-100*earned/70)>1e-9))errors.push('Automatic percentage differs from checks.');}return errors;}
function mediaErrors(l,strict){const t=TASKS.find(t=>t.id===l.task_id);if(!['X04','X05'].includes(l.task_id))return [];const expected=t.media_protocol,m=l.media_review,errors=[];if(!isObj(m)||!expected)return ['Missing video media_review protocol.'];for(const k of ['schema','task_id','input_packet_hash'])if(m[k]!==expected[k])errors.push('Video protocol binding differs: '+k);const audio=m.audio_check;if(!isObj(audio))return ['Missing video audio_check.'];if(audio.expected_soundtrack_sha256!==expected.audio_check.expected_soundtrack_sha256)errors.push('Soundtrack hash binding differs.');if(!['unassessed','present','missing'].includes(audio.status)||typeof audio.evidence!=='string')errors.push('Invalid audio check fields.');if(strict&&(!['present','missing'].includes(audio.status)||!nonempty(audio.evidence)))errors.push('Record observed soundtrack status and evidence.');if(strict&&audio.status==='missing'&&!l.essential_review?.some(e=>e.id==='audio'&&e.outcome==='fail'))errors.push('Missing soundtrack requires audio core outcome=fail.');if(!Array.isArray(m.observations)||m.observations.length!==expected.observations.length)errors.push('Video source/reference/listening observations missing or duplicated.');else m.observations.forEach((o,i)=>{const exp={...expected.observations[i]};if(exp.artifact==='output.mp4')exp.sha256=l.artifact_manifest?.['output.mp4']?.sha256??null;if(!isObj(o)||['artifact','sha256','action'].some(k=>!equal(o[k],exp[k]))){errors.push('Video observation binding changed: '+i);return;}if(typeof o.performed!=='boolean'||typeof o.evidence!=='string')errors.push(o.artifact+': invalid video observation fields.');if(strict){if(!nonempty(o.evidence))errors.push(o.artifact+': concrete video observation evidence required.');const allowed=o.action==='listened_full'&&audio.status==='missing';if(!o.performed&&!allowed)errors.push(o.artifact+': actual '+o.action+' required.');if(o.performed&&!o.sha256)errors.push(o.artifact+': cannot observe absent output bytes.');}});if(!Array.isArray(m.scenes)||m.scenes.length!==6)errors.push('All six scene observations are required.');else m.scenes.forEach((s,i)=>{const exp=expected.scenes[i];if(!isObj(s)||s.scene!==exp.scene||!equal(s.interval_seconds,exp.interval_seconds)){errors.push('Scene identity/interval changed: '+i);return;}if(typeof s.observed!=='boolean'||typeof s.evidence!=='string')errors.push('Invalid scene observation fields: '+s.scene);if(!Array.isArray(s.timecodes_seconds)||s.timecodes_seconds.some(v=>!finite(v)||v<exp.interval_seconds[0]||v>exp.interval_seconds[1]))errors.push('Scene '+s.scene+': timecodes must be finite seconds within '+exp.interval_seconds.join('–')+'.');if(strict&&(!s.observed||!nonempty(s.evidence)||!s.timecodes_seconds?.length))errors.push('Scene '+s.scene+': actual observation, timecodes and findings required.');});return errors;}
async function importFiles(files){const successes=[],failures=[];for(const file of files){try{if(file.size>5*1024*1024)throw Error('JSON exceeds the 5 MiB review/report limit.');const raw=await file.text();const obj=JSON.parse(raw);if(forbiddenKeys(obj))throw Error('Unsafe object keys.');if(invalidNumbers(obj))throw Error('Nonfinite or unsafe integer JSON values cannot be preserved.');const isLedger=obj.schema==='nrb-review-v1';const errors=isLedger?ledgerErrors(obj):autoErrors(obj);if(errors.length)throw Error(errors.join('\n'));const old=records.get(obj.task_id)||{};const other=isLedger?old.auto:old.ledger;if(other){const problems=isLedger?bindingErrors(obj,other):bindingErrors(other,obj);if(problems.length)throw Error(problems.join('\n'));}if(isLedger&&old.ledger){if(old.ledger.submission_hash!==obj.submission_hash||old.ledger.seed!==obj.seed)throw Error(text('replace'));if(old.dirty&&!confirm(text('unsaved')))continue;}if(!isLedger&&old.auto&&old.auto.report_hash!==obj.report_hash)throw Error(text('replace'));const next={...old};if(isLedger){next.ledger=clone(obj);next.original=clone(obj);next.dirty=false;next.exported=false;}else{next.auto=clone(obj);}records.set(obj.task_id,next);taskId=obj.task_id;track=TASKS.find(t=>t.id===taskId).track;successes.push(file.name+' · '+obj.task_id);}catch(error){failures.push(file.name+': '+error.message);}}render();notice([successes.length?text('imported')+': '+successes.join(', '):'',failures.length?text('rejected')+':\n'+failures.join('\n'): ''].filter(Boolean).join('\n'),failures.length?'error':'success');$('file-input').value='';}
function immutableReview(l){const x=clone(l);x.reviewer=null;x.criteria=x.criteria.map(({score,evidence,rationale,...rest})=>rest);x.essential_review=x.essential_review.map(({outcome,evidence,rationale,...rest})=>rest);x.observations=x.observations.map(({performed,evidence,...rest})=>rest);stripEditableMedia(x);return x;}
function stripEditableMedia(x){const m=x.media_review;if(!m)return;delete m.audio_check.status;delete m.audio_check.evidence;m.observations=m.observations.map(({performed,evidence,...rest})=>rest);m.scenes=m.scenes.map(({observed,timecodes_seconds,evidence,...rest})=>rest);}
function check(strict){const r=current();if(!r.ledger)return [text('needLedger')];const errors=ledgerErrors(r.ledger,strict,r.auto);if(!equal(immutableReview(r.ledger),immutableReview(r.original)))errors.push('Immutable review metadata changed. Reimport the evaluator packet.');return errors;}
function downloadReview(strict){const errors=check(strict);if(errors.length){notice(errors.join('\n'),'error');window.scrollTo({top:0,behavior:'smooth'});return;}const r=current(),blob=new Blob([JSON.stringify(r.ledger,null,2)+'\n'],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='review-'+taskId+(strict?'.json':'-draft.json');document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);r.dirty=false;r.exported=true;updateStats();notice(text('exported')+(strict?'':' '+text('draftNote')),'success');}
function edit(target){const kind=target.dataset.kind;if(!kind)return;const r=current();if(!r.ledger)return;const key=target.dataset.key,i=+target.dataset.index;let value=target.type==='checkbox'?target.checked:target.value;let obj;if(kind==='reviewer'){obj=r.ledger.reviewer;if(value==='')value=null;}else if(kind==='criterion'){obj=r.ledger.criteria[i];if(key==='score')value=value===''?null:Number(value);}else if(kind==='essential')obj=r.ledger.essential_review[i];else if(kind==='observation')obj=r.ledger.observations[i];else if(kind.startsWith('media')){editMedia(target,r);return;}if(!obj)return;obj[key]=value;r.dirty=true;r.exported=false;updateStats();}
function editMedia(target,r){const kind=target.dataset.kind,i=+target.dataset.index,key=target.dataset.key,m=r.ledger.media_review;const obj=kind==='media-audio'?m.audio_check:kind==='media-observation'?m.observations[i]:m.scenes[i];let value=target.type==='checkbox'?target.checked:target.value;if(key==='timecodes_seconds')value=value.trim()?value.trim().split(/[,，\s]+/).map(s=>/^(?:\d+(?:\.\d*)?|\.\d+)$/.test(s)?Number(s):NaN):[];obj[key]=value;r.dirty=true;r.exported=false;updateStats();}
$('file-input').addEventListener('change',event=>importFiles(Array.from(event.target.files)));
$('language').addEventListener('click',()=>{lang=lang==='zh'?'en':'zh';render();notice('');});
$('help-button').addEventListener('click',()=>{$('help-panel').classList.toggle('hidden');});
$('track-select').addEventListener('change',event=>{track=event.target.value;taskId=TASKS.find(t=>t.track===track).id;render();notice('');});
$('task-list').addEventListener('click',event=>{const b=event.target.closest('[data-task]');if(b){taskId=b.dataset.task;render();notice('');}});
$('main').addEventListener('input',event=>edit(event.target));
$('main').addEventListener('change',event=>{if(event.target.tagName==='SELECT'||event.target.type==='checkbox')edit(event.target);});
$('main').addEventListener('click',event=>{const id=event.target.closest('button')?.id;if(id==='export-draft')downloadReview(false);else if(id==='export-checked')downloadReview(true);else if(id==='validate'){const errors=check(true);notice(errors.length?errors.join('\n'):text('valid'),errors.length?'error':'success');window.scrollTo({top:0,behavior:'smooth'});}else if(id==='print'){render();window.print();}else if(id==='reset'&&confirm(text('discard'))){records.delete(taskId);render();notice('');}});
window.addEventListener('beforeprint',()=>render());
window.addEventListener('beforeunload',event=>{if([...records.values()].some(r=>r.dirty)){event.preventDefault();event.returnValue='';}});
render();
